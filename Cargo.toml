[package]
name = "hft-solana"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
yellowstone = [
    "dep:futures",
    "dep:tokio",
    "dep:yellowstone-grpc-client",
    "dep:yellowstone-grpc-proto",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
arc-swap = "1"
crossbeam-queue = "0.3"
futures = { version = "0.3", optional = true }
smallvec = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
solana-pubkey = { version = "3.0.0", features = ["curve25519", "sha2"] }
spl-token-2022-interface = "3.1"
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync"], optional = true }
yellowstone-grpc-client = { version = "14.0.1", optional = true }
yellowstone-grpc-proto = { version = "13.0.0", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
