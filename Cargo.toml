[package]
name = "hft-solana"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
meteora-damm = [
    "dep:bytemuck",
    "dep:meteora-cp-amm",
    "dep:meteora-damm-sdk",
]
meteora-dlmm = [
    "dep:meteora-dlmm-commons",
    "dep:solana-sdk-v2",
]
yellowstone = [
    "meteora-damm",
    "meteora-dlmm",
    "dep:futures",
    "dep:tokio",
    "dep:yellowstone-grpc-client",
    "dep:yellowstone-grpc-proto",
    "dep:serde",
    "dep:serde_json",
    "dep:solana-client",
    "dep:solana-account-decoder-client-types",
]

[dependencies]
arc-swap = "1"
bytemuck = { version = "1.20", optional = true }
crossbeam-queue = "0.3"
futures = { version = "0.3", optional = true }
smallvec = "1"
meteora-cp-amm = { package = "cp-amm", git = "https://github.com/MeteoraAg/damm-v2", rev = "a85c926607433f23f0ea60f4ca7b1ae92f4156cb", features = ["no-entrypoint", "no-custom-entrypoint"], optional = true }
meteora-damm-sdk = { package = "rust-sdk", git = "https://github.com/MeteoraAg/damm-v2", rev = "a85c926607433f23f0ea60f4ca7b1ae92f4156cb", optional = true }
meteora-dlmm-commons = { package = "commons", git = "https://github.com/MeteoraAg/dlmm-sdk", rev = "576919e3e4368e542c402f000b4264724f7f23ec", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
solana-account-decoder-client-types = { version = "2.3.13", optional = true }
solana-client = { version = "2.3.13", optional = true }
solana-pubkey = { version = "3.0.0", features = ["curve25519", "sha2"] }
solana-sdk-v2 = { package = "solana-sdk", version = "2.1.0", optional = true }
spl-token-2022-interface = "3.1"
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync"], optional = true }
yellowstone-grpc-client = { version = "14.0.1", optional = true }
yellowstone-grpc-proto = { version = "13.0.0", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
